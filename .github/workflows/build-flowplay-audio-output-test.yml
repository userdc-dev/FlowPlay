name: Build Flow Play Audio Output Picker APK

on:
  push:
    branches:
      - flowplay-audio-output-picker
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout FlowPlay source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Recolour launcher icons for all Android versions
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/recolor_launcher.py

      - name: Install Android SDK command-line tools and Android 37
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/flowplay-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -o "$RUNNER_TEMP/commandlinetools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/commandlinetools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/flowplay-cli"
          mv "$RUNNER_TEMP/flowplay-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android Auto browse source
        shell: bash
        run: |
          set -euo pipefail
          src="app/src/main/java/org/schabi/newpipe/player/mediabrowser/MediaBrowserImpl.kt"
          grep -q 'FeedDatabaseManager(context).getStreams' "$src"
          grep -q 'ID_SUBSCRIPTIONS ->' "$src"
          grep -q 'ID_TRENDING ->' "$src"
          grep -q 'populateSubscriptionStreams' "$src"
          grep -q 'ID_DISCOVER ->' "$src"
          echo "Whats New, Subscriptions, Trending and Explore browse handlers confirmed"

      - name: Verify Android Auto search and playlist actions
        shell: bash
        run: |
          set -euo pipefail
          src="app/src/main/java/org/schabi/newpipe/player/mediabrowser/MediaBrowserImpl.kt"
          service="app/src/main/java/org/schabi/newpipe/player/PlayerService.java"
          grep -q 'private fun searchForCar' "$src"
          grep -q 'CAR_SAVE_ACTION' "$src"
          grep -q 'appendToPlaylist' "$src"
          grep -q 'createPlaylist' "$src"
          grep -q 'BROWSER_SERVICE_EXTRAS_KEY_CUSTOM_BROWSER_ACTION_ROOT_LIST' "$src"
          grep -q 'Related to Recent' "$src"
          grep -q 'mediaBrowserImpl.onCustomAction' "$service"
          grep -q 'CarSaveActionProvider' app/src/main/java/org/schabi/newpipe/player/mediasession/MediaSessionPlayerUi.java
          echo "Search filters, car playlist saves and recommendations verified"

      - name: Verify Android native audio output menu
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/java/org/schabi/newpipe/MainActivity.java"
          grep -q 'MENU_ID_AUDIO_OUTPUT' "$file"
          grep -q 'MediaRouter2.getInstance(this).showSystemOutputSwitcher()' "$file"
          grep -q 'showPhoneAudioOutputSwitcher()' "$file"
          echo "Android native output picker menu and fallback verified"

      - name: Build signed debug-key Continuous APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleContinuous --no-daemon --stacktrace

      - name: Verify APK and name downloadable file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          source_apk="$(find app/build/outputs/apk/continuous -name '*.apk' -type f | head -n 1)"
          test -n "$source_apk" && test -s "$source_apk"
          cp "$source_apk" "dist/Flow_Play_Audio_Output_Test_0.29.1.apk"
          unzip -tq "dist/Flow_Play_Audio_Output_Test_0.29.1.apk"
          sha256sum "dist/Flow_Play_Audio_Output_Test_0.29.1.apk" | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Play-Audio-Output-Test-APK
          path: |
            dist/Flow_Play_Audio_Output_Test_0.29.1.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="flow-play-audio-output-test-0.29.1"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/Flow_Play_Audio_Output_Test_0.29.1.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/Flow_Play_Audio_Output_Test_0.29.1.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Flow Play 0.29.1 - Android Audio Output Test" \
              --notes "Experimental Android Auto music build with phone-side Android system audio output selector (Android 14+, uses MediaRouter2). Android Auto itself may still force the car as audio output. This does not bypass routing policy. Features: voice/parked search supports songs:, playlists:, channels:, videos:, my playlists: prefixes; Explore provides music/playlist/artist categories; supported hosts expose per-item Save to Car Saves and up to 3 existing playlist shortcuts. Related to Recent is based on NewPipe history. Car screen remains audio-only; Android Auto video not supported on most cars. New package identity means subscriptions/playlists require import. Adds now-playing Save to Car Saves button where head unit supports playback custom actions. Browse-save shortcuts also depend on car support. Not tested on physical head unit." \
              --prerelease
          fi
