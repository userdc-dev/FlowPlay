name: FlowPlay APK
on:
  push:
    branches: [flowplay-stable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build preview and run unit tests
        run: ./gradlew :app:assembleContinuous :app:testDebugUnitTest --stacktrace -DskipFormatKtlint
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPlay-preview
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
